# Secret reference template — shows expected keys without values.
#
# Use this as a reference when creating secrets via any method
# (kubectl create secret, SealedSecrets, ExternalSecrets, etc.).
#
# app-secret keys:
#   JWT_SECRET    - JWT signing secret (openssl rand -base64 32)
#   DB_USER       - Postgres username (e.g. "parental")
#   DB_PASSWORD   - Postgres password (openssl rand -base64 32)
#
# postgres-secret keys:
#   POSTGRES_USER     - Postgres superuser name (e.g. "parental")
#   POSTGRES_PASSWORD - Postgres superuser password (openssl rand -base64 32)
#   POSTGRES_DB       - Database name (e.g. "parental_coordination")
