# App Deployment for parental_coordination_back (dev-only).
#
# - Image: parental-coordination-back:latest (build locally with
#   `docker build -t parental-coordination-back:latest .` before applying).
# - envFrom: app-config (ConfigMap) + app-secret (Secret) provide all env vars.
#   The app reads DB_HOST=postgres, DB_PORT=5432, DB_NAME=parental_coordination,
#   JWT_SECRET, etc. via @nestjs/config ConfigModule.
# - Startup/readiness/liveness probe: GET /api/health — an unauthenticated
#   endpoint that verifies the app is up and can reach Postgres. Returns 200
#   with { "status": "ok", "db": "ok" } when the DB responds to SELECT 1, and
#   503 with { "status": "error", "db": "unavailable" } when it cannot.
# - imagePullPolicy: Never — the image is built locally for minikube.
# - Postgres must be running and Ready before the app starts (see README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parental-coordination-back
  labels:
    app: parental-coordination-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parental-coordination-back
  template:
    metadata:
      labels:
        app: parental-coordination-back
    spec:
      containers:
        - name: app
          image: parental-coordination-back:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
