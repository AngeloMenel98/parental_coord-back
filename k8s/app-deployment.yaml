# App Deployment for parental_coordination_back.
#
# - envFrom: app-config (ConfigMap) + app-secret (Secret) provide all env vars.
# - Startup/readiness/liveness probe: GET /api/health.
# - imagePullPolicy: IfNotPresent for production registries.
# - initContainer runs TypeORM migrations before the app starts.
# - Security context enforces non-root execution (UID 1000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parental-coordination-back
  labels:
    app: parental-coordination-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parental-coordination-back
  template:
    metadata:
      labels:
        app: parental-coordination-back
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: migrations
          image: parental-coordination-back:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/typeorm
            - migration:run
            - -d
            - dist/database/data-source.js
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: app
          image: parental-coordination-back:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
