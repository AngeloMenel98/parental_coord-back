# App Secret (dev-only).
#
# JWT_SECRET is required by the auth module (@nestjs/jwt).
# DB_USER and DB_PASSWORD are also included here so the app can connect to
# Postgres using envFrom. In production, these would come from a secrets
# manager or SealedSecrets.
#
# base64 values:
#   parental_secret -> cGFyZW50YWxfc2VjcmV0
#   change-me-in-production-use-a-real-secret -> Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdXNlLWEtcmVhbC1zZWNyZXQ=
#   parental -> cGFyZW50YWw=
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: parental-coordination-back
type: Opaque
data:
  JWT_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdXNlLWEtcmVhbC1zZWNyZXQ=
  DB_USER: cGFyZW50YWw=
  DB_PASSWORD: cGFyZW50YWxfc2VjcmV0
