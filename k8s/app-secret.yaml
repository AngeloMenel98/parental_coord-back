# App Secret (production placeholder).
#
# WARNING: Do NOT commit real secret values to version control.
# Replace PLACEHOLDER values before applying to a cluster.
#
# How to generate:
#   JWT_SECRET:    openssl rand -base64 32
#   DB_USER:       should match the Postgres user (default: parental)
#   DB_PASSWORD:   use a strong random password (openssl rand -base64 32)
#
# For production, use SealedSecrets, ExternalSecrets, or your cloud
# provider's secrets manager instead of plain Kubernetes Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: parental-coordination-back
type: Opaque
data:
  JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET
  DB_USER: REPLACE_WITH_BASE64_ENCODED_DB_USER
  DB_PASSWORD: REPLACE_WITH_BASE64_ENCODED_DB_PASSWORD
