# Headless ClusterIP Service (dev-only).
#
# clusterIP: None makes this a headless service: the StatefulSet's
# serviceName gives postgres-0 stable in-cluster DNS (`postgres:5432` inside
# the cluster) and there is no ClusterIP load-balancing (fine for 1 replica).
#
# Local dev reaches Postgres via `kubectl port-forward svc/postgres 5432:5432`.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
