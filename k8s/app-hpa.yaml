# HorizontalPodAutoscaler for the app.
#
# - Scales between 2 and 6 replicas based on CPU utilization.
# - Target CPU: 70% average utilization.
# - Scale-up stabilization window: 60s.
# - Scale-down stabilization window: 300s.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parental-coordination-back
  labels:
    app: parental-coordination-back
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parental-coordination-back
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
