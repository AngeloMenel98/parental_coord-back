# Postgres credentials Secret (dev-only).
#
# Values are base64-encoded and MUST match the project `.env`
# (DB_USER=parental, DB_PASSWORD=parental_secret, DB_NAME=parental_coordination)
# so the app running on the host can connect through `kubectl port-forward`.
#
# This is a plain dev Secret on purpose — kustomize/SealedSecrets is a future
# improvement (k8s/README.md caveats).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
data:
  # echo -n 'parental'                | base64  -> cGFyZW50YWw=
  # echo -n 'parental_secret'         | base64  -> cGFyZW50YWxfc2VjcmV0
  # echo -n 'parental_coordination'   | base64  -> cGFyZW50YWxfY29vcmRpbmF0aW9u
  POSTGRES_USER: cGFyZW50YWw=
  POSTGRES_PASSWORD: cGFyZW50YWxfc2VjcmV0
  POSTGRES_DB: cGFyZW50YWxfY29vcmRpbmF0aW9u
