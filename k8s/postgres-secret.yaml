# Postgres credentials Secret (production placeholder).
#
# WARNING: Do NOT commit real secret values to version control.
# Replace PLACEHOLDER values before applying to a cluster.
#
# How to generate:
#   POSTGRES_USER:     choose a secure username
#   POSTGRES_PASSWORD: openssl rand -base64 32
#   POSTGRES_DB:       your database name (e.g. parental_coordination)
#
# For production, use SealedSecrets, ExternalSecrets, or your cloud
# provider's secrets manager instead of plain Kubernetes Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
data:
  POSTGRES_USER: REPLACE_WITH_BASE64_ENCODED_POSTGRES_USER
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_POSTGRES_PASSWORD
  POSTGRES_DB: REPLACE_WITH_BASE64_ENCODED_POSTGRES_DB
