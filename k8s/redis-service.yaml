# Redis Service (dev-only, in-cluster).
#
# ClusterIP Service named `redis`: this name is what REDIS_HOST resolves to for
# the API and the worker (app-config ConfigMap). A normal ClusterIP is enough —
# there is a single replica and no need for stable per-pod DNS.
#
# Local dev reaches Redis via `kubectl port-forward svc/redis 6379:6379`.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
