services:
  postgres:
    image: postgres:16-alpine
    container_name: parental-coordination-postgres
    environment:
      POSTGRES_USER: parental
      POSTGRES_PASSWORD: parental_secret
      POSTGRES_DB: parental_coordination
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parental -d parental_coordination']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: parental-coordination-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot schema migrator.
  #
  # Runs the TypeORM CLI that is already baked into the image before the API or
  # the worker boot. Compose had no migration step at all, so both containers
  # started against whatever schema happened to exist (k8s solved the same
  # problem with the `migrations` initContainer in app-deployment.yaml).
  # Release gate W3.
  #
  # `restart: 'no'` is intentional: this container must exit 0, not loop.
  migrate:
    build: .
    container_name: parental-coordination-migrate
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/src/database/data-source.js',
      ]
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=parental
      - DB_PASSWORD=parental_secret
      - DB_NAME=parental_coordination
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    container_name: parental-coordination-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=parental
      - DB_PASSWORD=parental_secret
      - DB_NAME=parental_coordination
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret
      - JWT_EXPIRES_IN=7d
      - REALTIME_PUBLISH_ENABLED=true
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    container_name: parental-coordination-worker
    command: ['node', 'dist/src/worker.main.js']
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=parental
      - DB_PASSWORD=parental_secret
      - DB_NAME=parental_coordination
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret
      - JWT_EXPIRES_IN=7d
      - REALTIME_PUBLISH_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'kill', '-0', '1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Local Supabase Storage for activity attachments.
  #
  # Opt-in via profile so `docker compose up -d` keeps starting exactly the same
  # set of services as before:
  #
  #   docker compose --profile storage up -d
  #
  # Only the pieces storage actually needs are here. The official self-hosted
  # stack also runs Studio, GoTrue, Realtime, Edge Runtime, postgres-meta, imgproxy,
  # Logflare, Vector and Supavisor; none of them participate in the
  # presign -> PUT -> confirm flow this backend implements.
  #
  # Files land on the `storage-data` volume (`STORAGE_BACKEND: file`), so no S3
  # or MinIO is involved. The gateway strips the `/storage/v1` prefix that
  # supabase-js prepends; see docker/supabase/Caddyfile.
  #
  # The bucket is created by the one-shot `supabase-init` service. All values
  # that must agree with the backend come from .env (same file the API reads),
  # so the service-role key cannot drift between the two.
  # ---------------------------------------------------------------------------
  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: parental-supabase-db
    profiles: ['storage']
    environment:
      - POSTGRES_PASSWORD=${SUPABASE_DEV_DB_PASSWORD:-supabase_dev_secret}
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=/var/run/postgresql
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./docker/supabase/init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - '54322:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Only used because storage-api requires POSTGREST_URL at boot. It is not
  # part of the attachment flow.
  supabase-rest:
    image: postgrest/postgrest:v14.18
    container_name: parental-supabase-rest
    profiles: ['storage']
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SUPABASE_DEV_DB_PASSWORD:-supabase_dev_secret}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${SUPABASE_JWT_SECRET}
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped

  supabase-storage:
    image: supabase/storage-api:v1.81.0
    container_name: parental-supabase-storage
    profiles: ['storage']
    environment:
      - ANON_KEY=${SUPABASE_ANON_KEY}
      - SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AUTH_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - POSTGREST_URL=http://supabase-rest:3000
      - DATABASE_URL=postgres://supabase_storage_admin:${SUPABASE_DEV_DB_PASSWORD:-supabase_dev_secret}@supabase-db:5432/postgres
      - STORAGE_PUBLIC_URL=${SUPABASE_URL:-http://localhost:54321}
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - GLOBAL_S3_BUCKET=stub
      - TENANT_ID=stub
      - REGION=stub
      - FILE_SIZE_LIMIT=${ATTACHMENTS_MAX_SIZE_BYTES:-10485760}
      # Attachments are stored as uploaded; compression happens client-side.
      - ENABLE_IMAGE_TRANSFORMATION=false
      - S3_PROTOCOL_ACCESS_KEY_ID=625729a08b95bf1b7ff351a663f3a23c
      - S3_PROTOCOL_ACCESS_KEY_SECRET=850181e4652dd023b7a98c58ae0d2d34bd487ee0cc3254aed6eda37307425907
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: storage-api listens on IPv4 only while the
      # container resolves localhost to ::1, so the check would never pass.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/status']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  supabase-gateway:
    image: caddy:2-alpine
    container_name: parental-supabase-gateway
    profiles: ['storage']
    ports:
      - '54321:5000'
    volumes:
      - ./docker/supabase/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      supabase-storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/storage/v1/status']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # One-shot bucket bootstrap. Mirrors the `migrate` service pattern: it must
  # exit 0, not loop. Idempotent, so re-running the stack is harmless.
  supabase-init:
    image: postgres:16-alpine
    container_name: parental-supabase-init
    profiles: ['storage']
    environment:
      - PGPASSWORD=${SUPABASE_DEV_DB_PASSWORD:-supabase_dev_secret}
    command:
      - sh
      - -c
      - >
        psql -h supabase-db -U postgres -d postgres -v ON_ERROR_STOP=1 -c
        "INSERT INTO storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
        VALUES ('activity-attachments', 'activity-attachments', false,
        ${ATTACHMENTS_MAX_SIZE_BYTES:-10485760},
        ARRAY['image/jpeg','image/png','application/pdf'])
        ON CONFLICT (id) DO NOTHING;"
    depends_on:
      supabase-storage:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  supabase-db-data:
  storage-data:
